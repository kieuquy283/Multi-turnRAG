<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Chat Pro</title>

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Highlight -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/common.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-sidebar: #020617;
      --surface-1: #020617;
      --surface-2: #0f172a;
      --surface-3: #1e293b;

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;

      --primary: #3b82f6;
      --primary-hover: #2563eb;

      --border: #1e293b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      gap: 16px;
      padding: 16px;
    }

    .panel {
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--surface-1);
      border: 1px solid var(--border);
    }

    /* SIDEBAR */
    .sidebar {
      background: var(--bg-sidebar);
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .session-list {
      padding: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .session-item {
      background: var(--surface-2);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .session-item:hover {
      border-color: var(--primary);
    }

    .session-item.active {
      background: var(--surface-3);
      border-color: var(--primary);
    }

    .session-delete {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
    }

    /* CHAT */
    .chat {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .chat-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .chat-body {
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .bubble {
      max-width: 60%;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 14px;
    }

    .bubble.user {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 6px;
    }

    .bubble.assistant {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid var(--border);
      margin-right: auto;
      border-bottom-left-radius: 6px;
    }

    /* Markdown */
    .markdown-body pre {
      background: #020617;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
    }

    /* Input */
    .chat-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    textarea {
      width: 100%;
      min-height: 80px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: white;
    }

    textarea:focus {
      border-color: var(--primary);
      outline: none;
    }

    button {
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-hover);
    }

    /* Typing */
    .typing span {
      width: 6px;
      height: 6px;
      background: #64748b;
      border-radius: 50%;
      display: inline-block;
      animation: blink 1.4s infinite;
      margin-right: 4px;
    }

    .typing span:nth-child(2){animation-delay:0.2s;}
    .typing span:nth-child(3){animation-delay:0.4s;}

    @keyframes blink {
      0%,80%,100% {opacity:0.2;}
      40% {opacity:1;}
    }
  </style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="panel sidebar">
    <div class="sidebar-header">
      <strong>Chat RAG</strong>
      <button id="newSession">+</button>
    </div>
    <div id="sessionList" class="session-list"></div>
  </div>

  <!-- CHAT -->
  <div class="panel chat">
    <div class="chat-header">
      <strong>Chat AI</strong>
      <div id="sessionInfo"></div>
    </div>

    <div id="messageList" class="chat-body"></div>

    <div class="chat-footer">
      <textarea id="questionInput" placeholder="Nhập câu hỏi..."></textarea>
      <button id="sendButton">Gửi</button>
    </div>
  </div>

</div>

<script>
const sessionListEl = document.getElementById('sessionList');
const messageListEl = document.getElementById('messageList');
const questionInput = document.getElementById('questionInput');
const sendButton = document.getElementById('sendButton');
const newSessionButton = document.getElementById('newSession');

let sessions = [];
let activeSession = null;

/* ========= SESSION ========= */
async function fetchSessions() {
  const res = await fetch('/api/sessions');
  const data = await res.json();
  sessions = data.sessions || [];
  renderSessions();
}

async function createSessionWithName(name) {
  const res = await fetch('/api/sessions', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name})
  });
  const data = await res.json();
  sessions.unshift(data.session);
  await setActiveSession(data.session.id);
}

async function setActiveSession(id) {
  const res = await fetch(`/api/sessions/${id}`);
  const data = await res.json();
  activeSession = data.session;
  renderSessions();
  renderMessages();
}

/* ========= RENDER ========= */
function renderSessions() {
  sessionListEl.innerHTML = '';
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (activeSession?.id===s.id?' active':'');

    div.innerHTML = `
      <div onclick="setActiveSession('${s.id}')">${s.name}</div>
      <button class="session-delete" onclick="deleteSession('${s.id}')">x</button>
    `;
    sessionListEl.appendChild(div);
  });
}

function renderMessages() {
  messageListEl.innerHTML = '';
  activeSession?.history?.forEach(m => {
    const div = document.createElement('div');
    div.className = 'bubble ' + m.role;
    div.innerHTML = `
      <strong>${m.role==='user'?'Bạn':'Bot'}:</strong>
      <div class="markdown-body">${marked.parse(m.content)}</div>
    `;
    messageListEl.appendChild(div);
  });
}

/* ========= SCROLL ========= */
function scrollToBottom() {
  messageListEl.scrollTop = messageListEl.scrollHeight;
}

/* ========= STREAM ========= */
async function sendQuestion() {
  const q = questionInput.value.trim();
  if (!q) return;

  if (!activeSession) {
    await createSessionWithName("New Chat");
  }

  sendButton.disabled = true;

  // USER
  messageListEl.innerHTML += `<div class="bubble user">${q}</div>`;
  scrollToBottom();

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ session_id: activeSession.id, question: q })
  });

  const payload = await res.json();
  if (payload.error) {
    alert(payload.error);
    sendButton.disabled = false;
    return;
  }

  const answer = payload.reply?.answer || 'Không có phản hồi.';
  const botDiv = document.createElement('div');
  botDiv.className = 'bubble assistant';
  const contentDiv = document.createElement('div');
  contentDiv.className = 'markdown-body';
  contentDiv.innerHTML = marked.parse(answer);
  botDiv.appendChild(contentDiv);
  messageListEl.appendChild(botDiv);

  if (payload.session) {
    activeSession = payload.session;
    renderSessions();
  }

  scrollToBottom();

  questionInput.value = '';
  sendButton.disabled = false;
}

/* ========= DELETE ========= */
async function deleteSession(id) {
  await fetch(`/api/sessions/${id}`, {method:'DELETE'});
  sessions = sessions.filter(s => s.id!==id);
  renderSessions();
}

/* ========= EVENTS ========= */
sendButton.onclick = sendQuestion;
newSessionButton.onclick = () => createSessionWithName("New Chat");

fetchSessions();
</script>

</body>
</html>
